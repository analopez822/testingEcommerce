[pytest]
testpaths = tests
python_files = test_*.py
# Permite repetir el mismo nombre de archivo en varias carpetas (tests/admin/test_login.py y
# tests/customer/test_login.py) sin necesitar un __init__.py en cada carpeta nueva.
addopts = --import-mode=importlib
# En modo importlib la raíz ya no entra en sys.path: necesaria para `from pages...` / `from core...`
pythonpath = .
